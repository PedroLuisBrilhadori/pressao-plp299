<!DOCTYPE html>
<html lang="pt-BR">
<head><meta charset="UTF-8">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    width: 1200px; height: 630px;
    background: #0e1117;
    background-image: radial-gradient(circle at 85% 15%, rgba(124, 92, 255, 0.18), transparent 45%),
                      radial-gradient(circle at 10% 90%, rgba(255, 77, 90, 0.15), transparent 45%);
    color: #e8ebf2;
    font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    display: flex; flex-direction: column; justify-content: center;
    padding: 60px 80px;
    overflow: hidden;
  }
  .tag {
    display: inline-block; width: fit-content;
    font-size: 20px; text-transform: uppercase; letter-spacing: 0.12em;
    color: #ff4d5a; border: 2px solid #ff4d5a; border-radius: 999px;
    padding: 8px 22px; margin-bottom: 30px; font-weight: 700;
  }
  h1 { font-size: 64px; line-height: 1.15; margin-bottom: 28px; }
  h1 em { color: #ff4d5a; font-style: normal; }
  .facts { display: flex; gap: 18px; margin-bottom: 34px; }
  .fact {
    background: #1a2130; border: 1px solid #2a3244; border-radius: 12px;
    padding: 16px 26px; font-size: 26px; font-weight: 700; color: #ff4d5a;
  }
  .fact small { display: block; font-size: 15px; font-weight: 400; color: #9aa4b8; margin-top: 4px; }
  .url { font-size: 24px; font-weight: 700; color: #7c5cff; }
</style>
</head>
<body>
  <span class="tag">Campanha popular · PLP 299/2026</span>
  <h1>O pacote fiscal passa <em>de mansinho</em>.<br>Vamos avisar quem decide.</h1>
  <div class="facts">
    <div class="fact">2% a.a.<small>novo teto de gastos</small></div>
    <div class="fact">R$ 56 bi<small>impacto em 2027</small></div>
    <div class="fact">45 × 31<small>aprovado no Senado</small></div>
  </div>
  <div class="url">plp299nao.pedroluisbrilhadori.com.br</div>
</body>
</html>
